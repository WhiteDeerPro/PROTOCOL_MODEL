<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Protocol Model mark</title>
  <desc id="desc">A communication path changes organization around one typed event between two interface boundaries.</desc>

  <!--
    One mark, one fact:
      interface boundary -> stepped model path -> interface boundary.
    The event interrupts the path without introducing a direction or a fixed
    number of channels.
  -->
  <path fill="none" stroke="#6F8583" stroke-width="18" stroke-linecap="butt" stroke-linejoin="miter"
        d="M64 112h36v16h9m38 0h9v16h36"/>

  <rect x="28" y="40" width="44" height="176" rx="8" fill="#17191B"/>
  <rect x="184" y="40" width="44" height="176" rx="8" fill="#17191B"/>

  <rect x="113" y="113" width="30" height="30" rx="2" fill="#B5747A"/>
</svg>
