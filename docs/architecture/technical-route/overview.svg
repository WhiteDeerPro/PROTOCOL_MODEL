<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protocol Model：三种彼此独立的架构关系</title>
  <desc id="desc">图中分别展示代码构造依赖、约束判定作用域，以及通信的表示与运输。AXI、TileLink 和 CHI 是跨越这些坐标的协议族切片，不是某一层的子类。</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf3f7"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
    <marker id="blue-arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#2b64c8"/>
    </marker>
    <marker id="green-arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#16836d"/>
    </marker>
    <marker id="purple-arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#7654b8"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #14263a; }
      a { cursor: pointer; }
      a:hover .clickable { stroke-width: 2.8; }
      a:hover .link { text-decoration: underline; }
      .title { font-size: 36px; font-weight: 760; letter-spacing: -0.4px; }
      .subtitle { font-size: 17px; fill: #536b83; }
      .column-title { font-size: 23px; font-weight: 760; }
      .column-question { font-size: 14px; font-weight: 670; fill: #38546e; }
      .box-title { font-size: 16px; font-weight: 730; }
      .body { font-size: 13px; fill: #49647d; }
      .small { font-size: 12px; fill: #637b91; }
      .chip { font-size: 12px; font-weight: 690; }
      .link { font-size: 12px; font-weight: 720; fill: #245dbd; }
      .panel { fill: #ffffff; stroke: #cbd9e6; stroke-width: 1.3; }
      .blue-box { fill: #edf4ff; stroke: #8fb2e9; stroke-width: 1.2; }
      .green-box { fill: #ebf8f4; stroke: #78baa8; stroke-width: 1.2; }
      .purple-box { fill: #f4f0fc; stroke: #b09bd8; stroke-width: 1.2; }
      .orange-box { fill: #fff7e8; stroke: #e5b868; stroke-width: 1.2; }
      .neutral-box { fill: #f7f9fb; stroke: #c9d5e0; stroke-width: 1.1; }
      .blue-flow { fill: none; stroke: #2b64c8; stroke-width: 2.1; marker-end: url(#blue-arrow); }
      .green-flow { fill: none; stroke: #16836d; stroke-width: 2.1; marker-end: url(#green-arrow); }
      .purple-flow { fill: none; stroke: #7654b8; stroke-width: 2.1; marker-end: url(#purple-arrow); }
      .relation { fill: none; stroke: #7654b8; stroke-width: 1.6; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>

  <a href="README.md" xlink:href="README.md" target="_top">
    <text x="58" y="58" class="title link">不要把三种关系画成同一条协议栈</text>
  </a>
  <text x="58" y="91" class="subtitle">“由小构件组合”“需要观察多大范围”“通信被编码成什么”是三个问题；协议标准可以同时跨越它们。</text>

  <!-- Column 1: construction dependency -->
  <g filter="url(#shadow)"><rect x="58" y="130" width="450" height="570" rx="22" class="panel"/></g>
  <text x="84" y="172" class="column-title">① 构造依赖</text>
  <text x="84" y="198" class="column-question">代码怎样从可复用构件组合成可运行模型？</text>

  <a href="01-semantic-foundation.md" xlink:href="01-semantic-foundation.md" target="_top">
    <rect x="86" y="228" width="394" height="82" rx="14" class="blue-box clickable"/>
    <text x="108" y="257" class="box-title">共享语义内核</text>
    <text x="108" y="282" class="body">event schema · constraint · resource · obligation · pattern</text>
    <text x="393" y="299" class="link">详细说明 ↗</text>
  </a>
  <path d="M283 312 L283 340" class="blue-flow"/>

  <rect x="86" y="346" width="188" height="92" rx="14" class="neutral-box"/>
  <text x="106" y="374" class="box-title">通用设施</text>
  <text x="106" y="399" class="body">interface · representation</text>
  <text x="106" y="419" class="body">transport · observation</text>
  <rect x="292" y="346" width="188" height="92" rx="14" class="neutral-box"/>
  <text x="312" y="374" class="box-title">行为与系统设施</text>
  <text x="312" y="399" class="body">VirtualDut · integration</text>
  <text x="312" y="419" class="body">system · analysis</text>
  <path d="M283 440 L283 470" class="blue-flow"/>

  <rect x="86" y="476" width="394" height="92" rx="14" class="orange-box"/>
  <text x="108" y="505" class="box-title">具体协议族与 module recipe</text>
  <text x="108" y="530" class="body">AXI / AHB / APB / TileLink / CHI 按需选取上述设施</text>
  <text x="108" y="551" class="body">它们位于依赖图叶端，不反向定义通用内核。</text>
  <path d="M283 570 L283 600" class="blue-flow"/>

  <a href="06-observation-execution-evidence.md" xlink:href="06-observation-execution-evidence.md" target="_top">
    <rect x="86" y="606" width="394" height="66" rx="14" class="blue-box clickable"/>
    <text x="108" y="635" class="box-title">scenario · session · evidence</text>
    <text x="108" y="657" class="body">运行已组合的合同并留下 trace、因果关系和 verdict。</text>
  </a>

  <!-- Column 2: scope -->
  <g filter="url(#shadow)"><rect x="532" y="130" width="450" height="570" rx="22" class="panel"/></g>
  <text x="558" y="172" class="column-title">② 判定作用域与状态所有权</text>
  <text x="558" y="198" class="column-question">一条规则至少要观察哪些对象，谁持有可变状态？</text>

  <rect x="572" y="228" width="370" height="64" rx="14" class="green-box"/>
  <text x="594" y="256" class="box-title">Event</text>
  <text x="678" y="256" class="body">一个候选事件的字段、取值与局部几何</text>
  <path d="M757 294 L757 312 M660 312 L854 312 M660 312 L660 322 M854 312 L854 322" class="green-flow"/>

  <a href="02-patterns-and-interface-protocol.md" xlink:href="02-patterns-and-interface-protocol.md" target="_top">
    <rect x="572" y="328" width="176" height="76" rx="14" class="green-box clickable"/>
    <text x="590" y="355" class="box-title">Interface-local</text>
    <text x="590" y="378" class="body">完整接口的 event kind、</text>
    <text x="590" y="396" class="body">ordering、correlation</text>
  </a>
  <a href="../communication-scope-and-transport.md" xlink:href="../communication-scope-and-transport.md" target="_top">
    <rect x="766" y="328" width="176" height="76" rx="14" class="green-box clickable"/>
    <text x="784" y="355" class="box-title">Transport-hop</text>
    <text x="784" y="378" class="body">相邻 TX→RX 的 flit、</text>
    <text x="784" y="396" class="body">credit、activation</text>
  </a>
  <path d="M660 406 L660 420 L854 420 M757 420 L757 434" class="relation"/>

  <a href="03-virtual-dut.md" xlink:href="03-virtual-dut.md" target="_top">
    <rect x="572" y="440" width="370" height="76" rx="14" class="green-box clickable"/>
    <text x="594" y="469" class="box-title">VirtualDut · concrete module</text>
    <text x="594" y="494" class="body">跨端口 decode、store、route、transform、completion 决策</text>
  </a>
  <path d="M757 518 L757 546" class="green-flow"/>

  <a href="05-system-protocol.md" xlink:href="05-system-protocol.md" target="_top">
    <rect x="572" y="552" width="370" height="76" rx="14" class="green-box clickable"/>
    <text x="594" y="581" class="box-title">SystemProtocol</text>
    <text x="594" y="606" class="body">跨 module 的 identity、route closure、coherence 与 progress</text>
  </a>
  <text x="572" y="661" class="small">Interface 与 Transport 是并列观察面；图示不是严格的总序层级。</text>

  <!-- Column 3: representation and transport -->
  <g filter="url(#shadow)"><rect x="1006" y="130" width="536" height="570" rx="22" class="panel"/></g>
  <text x="1032" y="172" class="column-title">③ 表示与运输</text>
  <text x="1032" y="198" class="column-question">一项操作怎样被消息表达，又怎样占用传输资源？</text>

  <rect x="1042" y="228" width="190" height="66" rx="14" class="purple-box"/>
  <text x="1064" y="256" class="box-title">Operation</text>
  <text x="1064" y="279" class="body">意图与可见效果</text>
  <rect x="1320" y="228" width="190" height="66" rx="14" class="orange-box"/>
  <text x="1342" y="256" class="box-title">Transaction lifecycle</text>
  <text x="1342" y="279" class="body">完成操作并关联消息</text>
  <path d="M1234 261 L1314 261" class="relation"/>
  <text x="1249" y="247" class="small">realized by</text>
  <path d="M1415 296 L1415 332" class="purple-flow"/>

  <rect x="1042" y="340" width="190" height="64" rx="14" class="purple-box"/>
  <text x="1064" y="368" class="box-title">Message</text>
  <text x="1064" y="389" class="body">有类型的协议交换</text>
  <path d="M1234 372 L1282 372" class="purple-flow"/>
  <rect x="1288" y="340" width="190" height="64" rx="14" class="purple-box"/>
  <text x="1310" y="368" class="box-title">Packet</text>
  <text x="1310" y="389" class="body">带网络身份、可路由</text>
  <path d="M1383 406 L1383 438" class="purple-flow"/>
  <rect x="1288" y="446" width="190" height="64" rx="14" class="purple-box"/>
  <text x="1310" y="474" class="box-title">Flit</text>
  <text x="1310" y="495" class="body">hop flow-control 单位</text>
  <a href="../communication-scope-and-transport.md" xlink:href="../communication-scope-and-transport.md" target="_top">
    <rect x="1042" y="446" width="208" height="82" rx="14" class="orange-box clickable"/>
    <text x="1064" y="477" class="box-title">协议可以折叠若干形式</text>
    <text x="1064" y="505" class="body">APB 无需 packet/flit。</text>
  </a>
  <rect x="1042" y="552" width="190" height="64" rx="14" class="neutral-box"/>
  <text x="1064" y="580" class="box-title">Pin / AtomicFrame</text>
  <text x="1064" y="601" class="body">观察输入，不是下一层 flit</text>
  <path d="M1282 478 C1245 478 1245 584 1234 584" class="relation"/>
  <text x="1184" y="540" class="small">可被观察</text>
  <text x="1042" y="661" class="small">表示粒度与判定作用域正交：局部可检查的 flit 仍是 transport form。</text>

  <!-- Cross-cutting protocol family slices -->
  <text x="58" y="752" class="column-title">协议族如何落位</text>
  <text x="58" y="778" class="body">协议族选择它需要的坐标，不由目录位置宣称自己“更低”或“更高”。</text>

  <rect x="58" y="806" width="410" height="58" rx="16" fill="#eaf2ff" stroke="#8fb2e9"/>
  <text x="82" y="832" class="chip">AXI / AHB / APB</text>
  <text x="82" y="852" class="small">以 interface + module/system 合同为主，通常折叠 packet/flit。</text>

  <rect x="492" y="806" width="410" height="58" rx="16" fill="#edf8f4" stroke="#78baa8"/>
  <text x="516" y="832" class="chip">TileLink</text>
  <text x="516" y="852" class="small">interface/agent graph 与 module 边界独立，按观测目标展开网络。</text>

  <rect x="926" y="806" width="616" height="58" rx="16" fill="#f4f0fc" stroke="#b09bd8"/>
  <text x="950" y="832" class="chip">CHI</text>
  <text x="950" y="852" class="small">transaction/interface + message/packet + flit/CHI transport link + participant/system coherence。</text>
</svg>
